<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game with Ad Popup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, Helvetica, sans-serif; }

  /* ===== GAME SECTION ===== */
  #game-section {
    position: relative;
    width: 100%;
    height: 100vh;
    transition: filter 0.3s ease;
  }
  #game-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  /* Jab ad show ho rahi ho to game blurred/dim ho jaye taake user ko lage picha game hai */
  #game-section.blocked {
    filter: blur(6px) brightness(0.5);
  }
  /* Ad ke doran user game ko click na kar sake */
  #game-section.blocked #game-frame {
    pointer-events: none;
  }

  /* ===== FULLSCREEN AD OVERLAY ===== */
  #ad-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    display: none;              /* JS se flex hoga jab dikhana ho */
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  #ad-overlay.show {
    display: flex;
  }

  /* ===== AD BOX (350x250 - Medium Rectangle) ===== */
  #ad-box-wrapper {
    position: relative;
    width: 350px;
    background: #1b1b1b;
    border-radius: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  /* Yahan apna ad code / script daal sakte hain (350x250 slot) */
  #ad-slot {
    width: 350px;
    height: 250px;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 12px;
    position: relative;
  }

  #ad-label {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 10px;
    color: #999;
    letter-spacing: 1px;
    z-index: 2;
  }

  /* ===== BOTTOM BAR (YouTube style) ===== */
  #ad-bottom-bar {
    width: 350px;
    height: 34px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 10px;
    gap: 8px;
  }

  #countdown-text {
    color: #ddd;
    font-size: 13px;
    white-space: nowrap;
  }

  /* ===== SKIP BUTTON ===== */
  #skip-btn {
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    color: #000;
    background: #fff;
    border-radius: 3px;
    padding: 5px 12px;
    user-select: none;
    white-space: nowrap;
  }
  #skip-btn.visible {
    display: flex;
  }
</style>
</head>
<body>

<div id="game-section">
  <iframe id="game-frame" data-src="https://www.gameflare.com/embed/bad-egg/" allowfullscreen></iframe>
</div>

<!-- Fullscreen Ad Popup -->
<div id="ad-overlay">
  <div id="ad-box-wrapper">
    <div id="ad-slot">
      <span id="ad-label"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1879469387670618"
     crossorigin="anonymous"></script>
<!-- basketball.pro -->
<ins class="adsbygoogle"
     style="display:inline-block;width:350px;height:250px"
     data-ad-client="ca-pub-1879469387670618"
     data-ad-slot="4859054900"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</span>
      <!-- ===== 350x250 Ad Slot: apna ad script/iframe yahan daalein ===== -->
      <!-- Example: <ins class="adsbygoogle" style="display:inline-block;width:350px;height:250px" ...></ins> -->
    </div>

    <div id="ad-bottom-bar">
      <span id="countdown-text">Ad ends in 5</span>
      <div id="skip-btn" onclick="closeAd()">Skip Ad ▶</div>
    </div>
  </div>
</div>

<script>
  const AD_INTERVAL = 10 * 60 * 1000;   // har 10 minute baad ad dikhana
  const SKIP_DELAY   = 5 * 1000;        // 5 second baad skip button
  const AUTO_HIDE     = 30 * 1000;      // 30 second baad khud hide

  const overlay        = document.getElementById('ad-overlay');
  const gameSection     = document.getElementById('game-section');
  const skipBtn         = document.getElementById('skip-btn');
  const countdownText   = document.getElementById('countdown-text');
  const gameFrame       = document.getElementById('game-frame');

  let skipTimer, autoHideTimer, countdownInterval;
  let gameLoaded = false;

  function loadGame() {
    if (!gameLoaded) {
      gameFrame.src = gameFrame.getAttribute('data-src');
      gameLoaded = true;
    }
  }

  function showAd() {
    // Game turant load karo (agar pehli baar hai) taake background mein blurred dikhe
    loadGame();

    overlay.classList.add('show');
    gameSection.classList.add('blocked');

    skipBtn.classList.remove('visible');
    countdownText.style.display = 'inline';

    let remaining = SKIP_DELAY / 1000;
    countdownText.textContent = 'Ad ends in ' + remaining;

    countdownInterval = setInterval(() => {
      remaining--;
      if (remaining > 0) {
        countdownText.textContent = 'Ad ends in ' + remaining;
      }
      if (remaining <= 0) {
        clearInterval(countdownInterval);
      }
    }, 1000);

    // 5 second baad skip button dikhado
    skipTimer = setTimeout(() => {
      countdownText.style.display = 'none';
      skipBtn.classList.add('visible');
    }, SKIP_DELAY);

    // 30 second baad khud band ho jaye agar skip na kare
    autoHideTimer = setTimeout(() => {
      closeAd();
    }, AUTO_HIDE);
  }

  function closeAd() {
    overlay.classList.remove('show');
    gameSection.classList.remove('blocked');
    clearTimeout(skipTimer);
    clearTimeout(autoHideTimer);
    clearInterval(countdownInterval);
  }

  // Page load hotay hi sabse pehle ad popup show ho (game background mein load ho jayegi, blurred)
  window.addEventListener('DOMContentLoaded', showAd);

  // Har 10 minute baad dobara ad show hoti rahegi
  setInterval(showAd, AD_INTERVAL);
</script>

</body>
</html>
