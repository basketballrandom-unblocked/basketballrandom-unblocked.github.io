<script>

(() => {

    const GAME_ID = "k9w4ox";

    if (!GAME_URLS[GAME_ID]) return;

    const host = document.getElementById("game-root");

    const shadow = host.attachShadow({
        mode: "closed"
    });

    const frame = document.createElement("iframe");

    frame.src = GAME_URLS[GAME_ID];

    frame.allowFullscreen = true;

    frame.setAttribute(
        "allow",
        "fullscreen; autoplay; encrypted-media; accelerometer; gyroscope"
    );

    frame.style.cssText = `
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        border:0;
    `;

    shadow.appendChild(frame);

})();


    const adOverlay = document.getElementById("ad-overlay");
    const skipAdButton = document.getElementById("skip-ad");
    const autoHideDelay = 30000;
    const reappearDelay = 300000;
    let skipTimer = null;
    let hideTimer = null;
    let reappearTimer = null;

    function showAd() {
        adOverlay.classList.add("show");
        skipAdButton.disabled = true;
        skipAdButton.textContent = "Skip Ad (6)";

        let remaining = 6;
        clearInterval(skipTimer);
        skipTimer = setInterval(() => {
            remaining -= 1;
            if (remaining > 0) {
                skipAdButton.textContent = `Skip Ad (${remaining})`;
                return;
            }

            skipAdButton.textContent = "Skip Ad";
            skipAdButton.disabled = false;
            clearInterval(skipTimer);
        }, 1000);

        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            hideAd();
        }, autoHideDelay);
    }

    function hideAd() {
        adOverlay.classList.remove("show");
        clearInterval(skipTimer);
        clearTimeout(hideTimer);
        skipAdButton.disabled = true;
        skipAdButton.textContent = "Skip Ad";

        clearTimeout(reappearTimer);
        reappearTimer = setTimeout(() => {
            showAd();
        }, reappearDelay);
    }

    skipAdButton.addEventListener("click", () => {
        if (skipAdButton.disabled) return;
        hideAd();
    });

    showAd();
 

</script>
